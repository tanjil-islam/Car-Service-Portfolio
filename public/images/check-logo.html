<!DOCTYPE html>
<html>
<body style="background-color: #050505; display: flex; gap: 20px; padding: 50px;">
  <img src="logo.png" style="height: 100px; width: 100px;">
  
  <img src="logo.png" style="height: 100px; width: 100px; border-radius: 50%; object-fit: cover;">
  
  <img src="logo.png" style="height: 100px; width: 100px; mix-blend-mode: multiply; filter: invert(1);">
  
  <div style="background: white; border-radius: 50%; height: 100px; width: 100px; display: flex; align-items: center; justify-center; overflow: hidden;">
     <img src="logo.png" style="height: 100px; width: 100px; transform: scale(1.1);">
  </div>
</body>
</html>
